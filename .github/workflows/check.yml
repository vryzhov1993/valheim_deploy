name: Check role and encrypted bundle tooling
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml -p .local/collections
      - run: ansible-playbook -i localhost, tests/render-windows.yml
      - run: python -m unittest discover -s tests -v
      - run: ansible-playbook -i localhost, deploy.yml --syntax-check
      - run: ansible-playbook -i localhost, tests/syntax-windows.yml --syntax-check
      - run: python -m tests.smoke
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Check Windows import and service lifecycle without launching Valheim
        shell: powershell
        run: ./tests/windows.ps1 -TestService
